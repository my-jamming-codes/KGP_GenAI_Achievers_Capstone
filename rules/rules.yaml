  # ---------------------------------------------------------------- RELATED PARTY
  - rule_id: HFC-RELATED-PARTY
    theme: related_party_lending
    lender_type: hfc
    source: NBFC-CRM
    paragraph: "13G and 13I, applied to HFCs by paragraph 5(9) of the HFC Directions"
    paragraph_id: "NBFC-CRM/13G"
    quote:
      - "13G. Credit Facilities to related parties can be extended by an NBFC in terms of their credit policy. However, such loans, including personal loans to directors or a KMP, shall be subject to a materiality threshold as per the credit policy, which shall not be higher than the following ceilings:"
      - |
        | Category of NBFCs | Materiality Threshold
        | Upper Layer and Top Layer | ₹10 crore
        | Middle Layer | ₹5 crore
        | Base Layer | ₹1 crore
      - "13I. All loans above the prescribed materiality threshold shall be sanctioned by the Board of the NBFC."
      - "13J. Directors, KMP, or Specified employees shall recuse themselves from deliberations and decision on loan proposals, or contracts and arrangements, involving themselves or their related parties."
    link_quote:
      source: HFC-MD
      quote: "(9) Reserve Bank of India (Non-Banking Financial Companies – Credit Risk Management) Directions, 2025."
    values:
      materiality_threshold_ceiling:
        upper_and_top_layer: 100000000
        middle_layer: 50000000
        base_layer: 10000000
      above_threshold_sanction_by: "Board (or a Board committee other than the Audit Committee, if delegated)"
      recusal_required: true
    effective_date: "2026-04-01"
    amendments: "Inserted with effect from April 01, 2026 by the NBFC Credit Risk Management Amendment Directions, 2026 dated January 05, 2026."
    status: verified

  - rule_id: BANK-RELATED-PARTY-DIRECTORS
    theme: related_party_lending
    lender_type: bank
    source: CB-CRM
    paragraph: "14"
    paragraph_id: "CB-CRM/14"
    quote:
      - "14. In terms of Section 20(1)(b) of the BR Act, 1949, a bank is prohibited from entering into any commitment for granting any loans or advances to or on behalf of any of its directors, or any firm in which any of its directors is interested as partner, manager, employee or guarantor,"
      - "or any individual in respect of whom any of its directors is a partner or guarantor."
    values:
      loan_to_own_director_prohibited: true
      loan_to_individual_whose_partner_or_guarantor_is_a_director_prohibited: true
    effective_date: "2025-11-28"
    note: "Exceptions are listed in paragraph 15A(2) and following; read them before relying on this rule for an edge case."
    status: verified

  - rule_id: BANK-RELATED-PARTY-THRESHOLD
    theme: related_party_lending
    lender_type: bank
    source: CB-CRM
    paragraph: "42I and 42K"
    paragraph_id: "CB-CRM/42I"
    quote:
      - |
        | Asset Size of the bank (in ₹ crore) | Materiality Threshold Ceilings
        | > 10,00,000 | ₹25 crore
        | ≥ 1,00,000 to up to 10,00,000 | ₹10 crore
        | Less than 100,000 | ₹5 crore
      - "42K. All loans above the prescribed materiality threshold shall be sanctioned either by the Board or by the ‘Committee on Lending to Related Parties’ of the bank."
      - "42L. Directors, KMP, or ‘specified employees’ shall recuse themselves from deliberations and decision on loan proposals, or contracts and arrangements, involving themselves or their related parties."
    values:
      materiality_threshold_ceiling_by_bank_asset_size_crore:
        - {asset_size_above: 1000000, ceiling: 250000000}
        - {asset_size_from: 100000, asset_size_up_to: 1000000, ceiling: 100000000}
        - {asset_size_below: 100000, ceiling: 50000000}
      above_threshold_sanction_by: "Board or Committee on Lending to Related Parties"
      recusal_required: true
    effective_date: "2026-04-01"
    amendments: "Inserted with effect from April 01, 2026 by the Commercial Banks Credit Risk Management Amendment Directions, 2026 dated January 05, 2026."
    status: verified

  # ---------------------------------------------------------------- GRIEVANCE
  - rule_id: HFC-GRIEVANCE
    theme: grievance_redressal
    lender_type: hfc
    source: HFC-MD
    paragraph: "142 to 144"
    paragraph_id: "HFC-MD/144"
    quote:
      - "142. If a complaint has been received in writing from a customer, the HFC shall endeavour to send him/ her an acknowledgement/ response within a week."
      - "143. After examining the matter, the HFC shall send the customer its final response or explain why it needs more time to respond and shall endeavour to do so within six weeks of receipt of a complaint"
      - "144. The HFC shall publicise its grievance redressal procedure (e-mail id and other contact details at which the complaints can be lodged, turnaround time for resolving the issue, matrix for escalation, etc.) for lodging the complaints by the aggrieved borrower and ensure specifically that it is made available on its website."
      - "in case the complainant does not receive response from the company within a period of one month or is dissatisfied with the response received, the complainant may approach the Complaint Redressal Cell of National Housing Bank (NHB)"
    values:
      acknowledgement_within_days: 7
      final_response_within_weeks: 6
      escalation_to_nhb_after_months: 1
      escalation_body: "Complaint Redressal Cell of National Housing Bank"
    effective_date: "2025-11-28"
    status: verified

  - rule_id: BANK-GRIEVANCE
    theme: grievance_redressal
    lender_type: bank
    source: CB-RBC
    paragraph: "346"
    paragraph_id: "CB-RBC/346"
    quote:
      - "shall also lay down an appropriate grievance redressal mechanism within the organisation to resolve disputes arising in this regard. Such a mechanism shall ensure that all disputes arising out of the decisions of the bank’s functionaries are heard and disposed of at least at the next higher level."
    values:
      grievance_mechanism_required: true
      disputes_heard_at: "at least the next higher level"
    effective_date: "2025-11-28"
    note: >-
      Paragraph 346 sets up the mechanism but does not list the details a borrower must be given.
      The notice board list in Chapter IV names 'Grievance redressal mechanism' and the Integrated Ombudsman Scheme,
      but its paragraph number was not pinned down, so no record is written for it.
    status: verified
