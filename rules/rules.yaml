  # ---------------------------------------------------------------- GUARANTOR
  - rule_id: HFC-GUARANTOR-DISCLOSURE
    theme: guarantor_disclosure
    lender_type: hfc
    source: HFC-MD
    paragraph: "158"
    paragraph_id: "HFC-MD/158"
    quote:
      - "158. When a person is considering being a guarantor to a loan, they should be informed about:"
      - "(1) their liability as guarantor;"
      - "(2) the amount of liability they will be committing themselves to the company;"
      - "(3) circumstances in which the HFC will call on them to pay up their liability;"
      - "(4) whether the HFC has recourse to their other monies in the company if he/ she fail to pay up as a guarantor;"
      - "(5) whether their liabilities as a guarantor are limited to a specific quantum or are they unlimited;"
      - "(6) time and circumstances in which their liabilities as a guarantor will be discharged as also the manner in which the HFC will notify them about this; and"
      - "(7) In case the guarantor refuses to comply with the demand made by the creditor/ lender, despite having sufficient means to make payment of the dues, such guarantor would also be treated as a wilful defaulter."
    values:
      items_to_inform: 7
      timing: "when a person is considering being a guarantor (i.e. before the guarantee is given)"
    effective_date: "2025-11-28"
    status: verified

