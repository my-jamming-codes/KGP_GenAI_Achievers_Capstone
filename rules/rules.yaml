rules:

  # ---------------------------------------------------------------- LOAN TO VALUE
  - rule_id: HFC-LTV-CAP
    theme: loan_to_value_cap
    lender_type: hfc
    source: HFC-MD
    paragraph: "58"
    paragraph_id: "HFC-MD/58"
    applies_to_borrower: individual
    quote:
      - "58. No housing finance company shall grant housing loans to individuals:"
      - "(1) up to ₹30 lakh with LTV ratio exceeding 90 percent,"
      - "(2) above ₹30 lakh and up to ₹75 lakh with LTV ratio exceeding 80 percent, and,"
      - "(3) above ₹75 lakh with LTV ratio exceeding 75 per cent"
    values:
      bands:
        - {loan_above: 0,       loan_up_to: 3000000, max_ltv_pct: 90}
        - {loan_above: 3000000, loan_up_to: 7500000, max_ltv_pct: 80}
        - {loan_above: 7500000, loan_up_to: null,    max_ltv_pct: 75}
    effective_date: "2025-11-28"
    amendments: "No amendment footnote on paragraph 58 in the version updated as on 2026-10-01."
    status: verified

  - rule_id: HFC-LTV-COMPUTE
    theme: loan_to_value_computation_and_stamp_duty
    lender_type: hfc
    source: HFC-MD
    paragraph: "58 Note (1)"
    paragraph_id: "HFC-MD/58-Note1"
    quote:
      - "(1) The LTV ratio shall be computed as a percentage with total outstanding in the account (viz, “principal + accrued interest + other charges pertaining to the loan” without any netting) in numerator and the realizable value of the residential property mortgaged to the HFC in the denominator."
      - "The HFC shall not include stamp duty, registration and other documentation charges in the cost of the housing property they finance so that the effectiveness of LTV norms is not diluted."
      - "in cases where the cost of the house/ dwelling unit does not exceed ₹10 lakh, HFC may add stamp duty, registration and other documentation charges to the cost of the house/ dwelling unit for the purpose of computing LTV ratio."
    values:
      numerator: "total outstanding (principal + accrued interest + other charges), no netting"
      denominator: "realizable value of the residential property mortgaged"
      stamp_duty_included_by_default: false
      stamp_duty_addable_if_cost_up_to: 1000000
    effective_date: "2025-11-28"
    status: verified

  - rule_id: BANK-LTV-CAP
    theme: loan_to_value_cap
    lender_type: bank
    source: CB-CF
    paragraph: "111"
    paragraph_id: "CB-CF/111"
    applies_to_borrower: individual
    quote:
      - "111. The bank shall abide by the following Loan to Value (LTV) and Risk Weights (RWs) while deciding the quantum of loan to be granted as housing finance:"
      - |
        | Category of Loan | LTV Ratio (%) | Risk Weight (%)
        | (a) Individual Housing Loans | |
        | Up to ₹30 lakh | ≤ 80 | 35
        | > 80 and ≤ 90 | 50
        | Above ₹30 lakh & up to ₹75 lakh | ≤ 80 | 35
        | Above ₹75 lakh | ≤ 75 | 50
    values:
      bands:
        - {loan_above: 0,       loan_up_to: 3000000, max_ltv_pct: 90}
        - {loan_above: 3000000, loan_up_to: 7500000, max_ltv_pct: 80}
        - {loan_above: 7500000, loan_up_to: null,    max_ltv_pct: 75}
      note: "Table applies to loans sanctioned after June 06, 2017; a proviso gives a separate table for loans sanctioned till June 06, 2017."
    effective_date: "2025-11-28"
    amendments: "Paragraph 111 carries no amendment footnote in the version updated as on 2026-07-15."
    link_quote:
      source: CB-CF-CURRENT
      quote: "111. The bank shall abide by the following Loan to Value (LTV) and Risk Weights (RWs) while deciding the quantum of loan to be granted as housing finance:"
    current_version_check: "Paragraph 111 and its table re-read in the current PDF (updated as on October 1, 2026) on 2026-11-12: same bands, LTV ratios and risk weights. Table quote is checked against the July 15, 2026 web version because the PDF table does not extract row by row."
    status: verified

  - rule_id: BANK-LTV-COMPUTE
    theme: loan_to_value_computation_and_stamp_duty
    lender_type: bank
    source: CB-CF
    paragraph: "113"
    paragraph_id: "CB-CF/113"
    quote:
      - "113. In order to have uniformity in the practices adopted for deciding the value of the house property while sanctioning housing loans, bank shall not include stamp duty, registration and other documentation charges in the cost of the housing property it finances so that the effectiveness of LTV norms is not diluted."
      - "Exemption: In cases where the cost of the house / dwelling units does not exceed ₹10 lakh, the bank may add stamp duty, registration and other documentation charges to the cost of the house/dwelling unit for the purpose of calculating LTV ratio."
    values:
      stamp_duty_included_by_default: false
      stamp_duty_addable_if_cost_up_to: 1000000
    effective_date: "2025-11-28"
    link_quote:
      source: CB-CF-CURRENT
      quote: "Exemption: In cases where the cost of the house / dwelling units does not exceed ₹10 lakh, the bank may add stamp duty, registration and other documentation charges to the cost of the house/dwelling unit for the purpose of calculating LTV ratio."
    current_version_check: "Paragraph 113 re-read in the current PDF (updated as on October 1, 2026) on 2026-11-12: unchanged."
    status: verified

  # ---------------------------------------------------------------- RISK WEIGHT
  - rule_id: HFC-RW
    theme: risk_weight_by_ltv
    lender_type: hfc
    source: HFC-MD
    paragraph: "22, table Sr. No. (3)(b)"
    paragraph_id: "HFC-MD/22-3b"
    quote:
      - "(b)(i) Outstanding Housing loans to individuals up to ₹30 lakh secured by mortgage of immovable property, which are classified as standard assets with LTV Ratio ≤ 80% | 35"
      - "(b)(ii) Outstanding Housing loans to individuals up to ₹30 lakh secured by mortgage of immovable property, which are classified as standard assets with LTV Ratio > 80% and ≤ 90% | 50"
      - "(b)(iii) Outstanding Housing loans to individuals above ₹30 lakh and upto ₹75 lakh secured by mortgage of immoveable property which are classified as standard assets with LTV ratio ≤ 75% (loan sanctioned before 01-08-2017) | 35"
      - "(b)(iv) Outstanding Housing loans to individuals above ₹30 lakh and upto ₹75 lakh secured by mortgage of immoveable property which are classified as standard assets with LTV ratio > 75% and ≤ 80% (loan sanctioned before 01-08-2017) | 50"
      - "(b)(v) Outstanding Housing loans to individuals above ₹30 lakh and upto ₹75 lakh secured by mortgage of immoveable property which are classified as standard assets with LTV ratio ≤ 80% (loan sanctioned on or after 01-08-2017) | 35"
      - "(b)(vi) Outstanding Housing loans to individuals above ₹75 lakh secured by mortgage of immoveable property, which are classified as standard assets with LTV ratio ≤ 75% (loan sanctioned before 01-08-2017) | 75"
      - "(b)(vii) Outstanding Housing loans to individuals above ₹75 lakh secured by mortgage of immoveable property, which are classified as standard assets with LTV ratio ≤ 75% (loan sanctioned on or after 01-08-2017) | 50"
      - "| c) | Other housing loans | 100"
    values:
      condition: "housing loan to an individual, secured by mortgage, classified as standard asset"
      sanction_cutoff: "2017-08-01"
      rows:
        - {loan_above: 0,       loan_up_to: 3000000, ltv_above: 0,  ltv_up_to: 80, sanctioned: any,             risk_weight_pct: 35, item: "(b)(i)"}
        - {loan_above: 0,       loan_up_to: 3000000, ltv_above: 80, ltv_up_to: 90, sanctioned: any,             risk_weight_pct: 50, item: "(b)(ii)"}
        - {loan_above: 3000000, loan_up_to: 7500000, ltv_above: 0,  ltv_up_to: 75, sanctioned: before_cutoff,   risk_weight_pct: 35, item: "(b)(iii)"}
        - {loan_above: 3000000, loan_up_to: 7500000, ltv_above: 75, ltv_up_to: 80, sanctioned: before_cutoff,   risk_weight_pct: 50, item: "(b)(iv)"}
        - {loan_above: 3000000, loan_up_to: 7500000, ltv_above: 0,  ltv_up_to: 80, sanctioned: on_or_after_cutoff, risk_weight_pct: 35, item: "(b)(v)"}
        - {loan_above: 7500000, loan_up_to: null,    ltv_above: 0,  ltv_up_to: 75, sanctioned: before_cutoff,   risk_weight_pct: 75, item: "(b)(vi)"}
        - {loan_above: 7500000, loan_up_to: null,    ltv_above: 0,  ltv_up_to: 75, sanctioned: on_or_after_cutoff, risk_weight_pct: 50, item: "(b)(vii)"}
      other_housing_loans_pct: 100
    effective_date: "2025-11-28"
    status: verified

  - rule_id: BANK-RW-CURRENT
    theme: risk_weight_by_ltv
    lender_type: bank
    source: CB-CAP
    paragraph: "55, Table 12"
    paragraph_id: "CB-CAP/55-T12"
    quote:
      - "Lending to individuals meant for acquiring residential property which are fully secured by mortgages on the residential property that is or will be occupied by the borrower, or that is rented, shall be risk weighted as indicated at Tables 11, 12 and 13 below, based on Board approved valuation policy."
      - |
        | Table 12: Claims secured by residential property – risk weights for loans sanctioned on or after June 07, 2017
        | Category of Loan | LTV Ratio (%) | Risk Weight (%)
        | (a) Individual Housing Loans | |
        | (i) Up to ₹30 lakh | ≤80 | 35
        | >80 and ≤90 | 50
        | (ii) Above ₹30 lakh and up to ₹75 lakh | ≤80 | 35
        | (iii) Above ₹75 lakh | ≤75 | 50
    values:
      sanctioned_on_or_after: "2017-06-07"
      rows:
        - {loan_above: 0,       loan_up_to: 3000000, ltv_above: 0,  ltv_up_to: 80, risk_weight_pct: 35}
        - {loan_above: 0,       loan_up_to: 3000000, ltv_above: 80, ltv_up_to: 90, risk_weight_pct: 50}
        - {loan_above: 3000000, loan_up_to: 7500000, ltv_above: 0,  ltv_up_to: 80, risk_weight_pct: 35}
        - {loan_above: 7500000, loan_up_to: null,    ltv_above: 0,  ltv_up_to: 75, risk_weight_pct: 50}
    effective_date: "2025-11-28"
    effective_until: "2027-03-31"
    superseded_by: BANK-RW-2027
    link_quote:
      source: CB-CAP-CURRENT
      quote: "Lending to individuals meant for acquiring residential property which are fully secured by mortgages on the residential property that is or will be occupied by the borrower, or that is rented, shall be risk weighted as indicated at Tables 11, 12 and 13 below, based on Board approved valuation policy."
    current_version_check: "Paragraph 55 and Table 12 re-read in the current PDF (updated as on October 07, 2026) on 2026-11-12: same rows and risk weights. Table quote is checked against the July 01, 2026 web version."
    status: verified

  - rule_id: BANK-RW-2027
    theme: risk_weight_by_ltv
    lender_type: bank
    source: CB-SA-2027
    paragraph: "16(5)(ii), Tables 9 and 10"
    paragraph_id: "CB-SA-2027/16-5-ii"
    quote:
      - "(2) These instructions shall come into effect from April 01, 2027."
      - "(a) Housing loans to individuals for up to two housing loans (shall include all existing as well as fresh loans, but shall exclude fully repaid loans), which shall be treated as their primary residences, shall attract the following risk weights as per the ceilings of LTV ratio prescribed subject to compliance of qualifying conditions mentioned at paragraph 16(2):"
      - |
        | Table 9 - Housing Loans to Individuals – Up to two loans
        | LTV | ≤ 50% | >50% to ≤ 60% | > 60% to ≤ 80% | > 80% to ≤ 90%
        | Risk weight (%) | 20 | 25 | 30 | 40
      - |
        | Table 10 - Housing Loans to Individuals – Third loan onward
        | LTV | ≤ 50% | >50% to ≤ 60% | > 60% to ≤ 80% | > 80% to ≤ 90%
        | Risk weight (%) | 30 | 35 | 45 | 60
    values:
      condition: "subject to qualifying conditions in paragraph 16(2); no loan size bands"
      up_to_two_loans:
        - {ltv_above: 0,  ltv_up_to: 50, risk_weight_pct: 20}
        - {ltv_above: 50, ltv_up_to: 60, risk_weight_pct: 25}
        - {ltv_above: 60, ltv_up_to: 80, risk_weight_pct: 30}
        - {ltv_above: 80, ltv_up_to: 90, risk_weight_pct: 40}
      third_loan_onward:
        - {ltv_above: 0,  ltv_up_to: 50, risk_weight_pct: 30}
        - {ltv_above: 50, ltv_up_to: 60, risk_weight_pct: 35}
        - {ltv_above: 60, ltv_up_to: 80, risk_weight_pct: 45}
        - {ltv_above: 80, ltv_up_to: 90, risk_weight_pct: 60}
    effective_date: "2027-04-01"
    supersedes: BANK-RW-CURRENT
    status: verified

  # ---------------------------------------------------------------- VALUATION
  - rule_id: HFC-VALUATION
    theme: valuation_of_property
    lender_type: hfc
    source: HFC-MD
    paragraph: "215"
    paragraph_id: "HFC-MD/215"
    quote:
      - "215. The HFC is required to put in place a Board approved valuation policy for putting in place a system/ procedure for realistic valuation of properties/ fixed assets and also for empanelment of valuers in accordance with the details contained in Annex V."
    values:
      board_approved_valuation_policy_required: true
    effective_date: "2025-11-28"
    status: verified

  - rule_id: HFC-VALUATION-ANNEX-V
    theme: valuation_of_property
    lender_type: hfc
    source: HFC-ANNEX-V
    paragraph: "Annex V, 1.2, 1.3, 1.5, 1.6 and 1.8"
    paragraph_id: "HFC-MD/Annex-V"
    quote:
      - "1.2. The valuation shall be done by professionally qualified independent valuers i.e. the valuer should not have a direct or indirect interest. However, valuation of properties by the internal technical valuers of housing finance companies is permissible subject to the internal technical valuer having qualifications similar to those prescribed under the Companies (Registered Valuers and Valuation) Rules, 2017."
      - "Further, where the value of the properties has been substantially impaired by any event, these are to be immediately revalued and appropriately factored in to capital adequacy computation."
      - "1.5. HFCs shall obtain minimum two valuation reports, at least one of them being from an independent valuer, in case the loan amount is ₹50 lakh or above (or such any other lower value as may be decided by the Board of the company) and below ₹75 lakh. The lower of the two valuations shall be considered by the HFC for deciding upon the loan amount."
      - "1.6. In case the loan amount is ₹75 lakh or above, HFCs shall necessarily obtain minimum two independent valuation reports and the lower of the two shall be considered by the HFC for deciding upon the loan amount."
      - "1.8. In respect of financing of any initial transaction of the purchase of a property, the value of the property for the purposes of arriving at the Loan to Value ratio (LTV) should not exceed the documented transaction value as per the agreement to sale, sale deed etc."
    values:
      independent_valuer_required: true
      internal_technical_valuer_allowed_if_qualified: true
      two_valuation_reports_if_loan_at_least: 5000000
      two_independent_valuation_reports_if_loan_at_least: 7500000
      use_lower_of_two_valuations: true
      ltv_value_capped_at_documented_transaction_value: true
      fresh_valuation: "frequency set by the Board; annual for NPAs as described in 1.3; immediate revaluation where value is substantially impaired"
    effective_date: "2025-11-28"
    status: verified

  - rule_id: BANK-VALUATION
    theme: valuation_of_property
    lender_type: bank
    source: CB-CRM
    paragraph: "70"
    paragraph_id: "CB-CRM/70"
    quote:
      - "(1) A bank shall have a Board approved policy in place for valuation of properties including collaterals accepted for their exposures."
      - "(2) The valuation shall be done by professionally qualified independent valuers i.e. the valuer shall not have a direct or indirect interest."
      - "(3) A bank shall obtain minimum two Independent valuation reports for properties valued at ₹50 crore or above."
    values:
      board_approved_valuation_policy_required: true
      independent_valuer_required: true
      two_valuations_if_property_value_at_least: 500000000
    effective_date: "2025-11-28"
    note: "No paragraph on when a fresh valuation of a mortgaged house is required was found in paragraphs 69 to 73."
    status: verified

  # ---------------------------------------------------------------- PREPAYMENT
  - rule_id: HFC-PREPAY-HOUSING
    theme: prepayment_charges
    lender_type: hfc
    source: HFC-MD
    paragraph: "163"
    paragraph_id: "HFC-MD/163"
    quote:
      - "163. The HFC shall not charge pre-payment levy or penalty on pre-closure of housing loans under the following situations:"
      - "(1) Where the housing loan is on floating interest rate basis and pre-closed from any source."
      - "(2) Where the housing loan is on fixed interest rate basis and the loan is preclosed by the borrower out of their own sources."
      - "Note: The expression “own sources” for the purpose means any source other than by borrowing from a bank/ HFC/ NBFC and/or a financial institution."
    values:
      floating_rate_any_source_charge_allowed: false
      fixed_rate_own_sources_charge_allowed: false
      fixed_rate_other_sources: "not prohibited by paragraph 163"
    effective_date: "2025-11-28"
    status: verified

  - rule_id: HFC-PREPAY-FLOATING-INDIVIDUAL
    theme: prepayment_charges
    lender_type: hfc
    source: NBFC-RBC
    paragraph: "33 and 34(1), applied to HFCs by paragraph 164 of the HFC Directions"
    paragraph_id: "NBFC-RBC/34-1"
    quote:
      - "33. In case of existing loans sanctioned or renewed on or before December 31, 2025, an NBFC shall not levy pre-payment charges on any floating rate term loan sanctioned for purposes other than business to individual borrowers, with or without co-obligant(s)."
      - "(1) For all floating rate loans granted for purposes other than business to individuals, with or without co-obligant(s), an NBFC shall not levy pre-payment charges."
      - "(3) The Directions at paragraphs 34(1) and 34(2) above shall be applicable irrespective of the source of funds used for pre-payment of loans, either in part or in full, and without any minimum lock-in period."
    link_quote:
      source: HFC-MD
      quote: "164. HFCs shall comply with the provisions of paragraph 33 to 34 of Reserve Bank of India (Non-Banking Financial Companies – Responsible Business Conduct) Directions, 2025."
    values:
      floating_rate_individual_non_business_charge_allowed: false
      para_34_applies_to_loans_sanctioned_or_renewed_on_or_after: "2026-01-01"
      para_33_applies_to_loans_sanctioned_or_renewed_on_or_before: "2025-12-31"
    effective_date: "2026-01-01"
    status: verified

