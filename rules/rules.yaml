# RBI Home Loan Rule Checker - rules file
# Every value below was taken from RBI text downloaded from rbi.org.in and read on the date shown.
# Nothing here is from memory, a blog, or another country's rules.
# status: verified   = quoted wording read in the latest version published on rbi.org.in
#         unverified = see `unverified_reason`. Tools and gold answers must NOT use an unverified record.
# Each `quote` segment is checked verbatim against the parsed source by rules/check_quotes.py.
# Money is in rupees (1 lakh = 100000, 1 crore = 10000000).

