  # ---------------------------------------------------------------- RATE RESET
  - rule_id: HFC-RATE-RESET
    theme: interest_rate_reset_communication
    lender_type: hfc
    source: NBFC-RBC
    paragraph: "31(1) and 31(6), applied to HFCs by paragraph 176(3) of the HFC Directions"
    paragraph_id: "NBFC-RBC/31"
    quote:
      - "31. The following instructions shall be applicable to the existing as well as new personal loans with effect from January 1, 2024."
      - "(1) At the time of sanction, an NBFC shall clearly communicate to the borrowers about the possible impact of change in benchmark interest rate on the loan leading to changes in EMI and / or tenor or both. Subsequently, any increase in the EMI / tenor or both on account of the above shall be communicated to the borrower immediately through appropriate channels."
      - "(6) An NBFC shall share / make accessible to the borrowers, through appropriate channels, a statement at the end of each quarter"
    link_quote:
      source: HFC-MD
      quote: "(3) Reset of Floating Interest Rate on Equated Monthly Instalments (EMI) based Personal Loans (paragraph 31 to 32)."
    values:
      communicate_impact_at_sanction: true
      communicate_increase_in_emi_or_tenor: "immediately"
      statement_frequency: "end of each quarter"
    effective_date: "2024-01-01"
    status: verified

