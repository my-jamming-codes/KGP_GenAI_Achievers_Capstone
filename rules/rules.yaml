  # ---------------------------------------------------------------- KFS AND BORROWER DISCLOSURE
  - rule_id: HFC-KFS
    theme: key_facts_statement
    lender_type: hfc
    source: NBFC-RBC
    paragraph: "29(1) and 29(2), applied to HFCs by paragraph 175 of the HFC Directions"
    paragraph_id: "NBFC-RBC/29"
    quote:
      - "29. The following instructions shall be applicable in case of all new retail and MSME term loans sanctioned on or after October 1, 2024, including fresh loans to existing customers, by an NBFC."
      - "(1) An NBFC shall provide a KFS to all prospective borrowers to help them take an informed view before executing the loan contract, as per the standardised format given in the Annex I. The KFS shall be written in a language understood by such borrowers. Contents of KFS shall be explained to the borrower and an acknowledgement shall be obtained that they have understood the same."
      - "(2) The KFS shall be provided with a unique proposal number and shall have a validity period of at least three working days for loans having tenor of seven days or more, and a validity period of one working day for loans having tenor of less than seven days."
    link_quote:
      source: HFC-MD
      quote: "175. HFCs shall comply with the provisions of paragraph 29 of Reserve Bank of India (Non-Banking Financial Companies – Responsible Business Conduct) Directions, 2025"
    values:
      kfs_before_executing_loan_contract: true
      borrower_acknowledgement_required: true
      validity_working_days_if_tenor_7_days_or_more: 3
      validity_working_days_if_tenor_under_7_days: 1
      applies_to_loans_sanctioned_on_or_after: "2024-10-01"
    effective_date: "2024-10-01"
    status: verified

