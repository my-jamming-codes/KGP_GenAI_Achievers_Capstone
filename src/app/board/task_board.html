<!-- Task board: a standalone page. The app replaces the TASKS_JSON placeholder below with src/app/board/tasks.json. -->
<style>
  :root { --bg: #fbfbf9; --fg: #1d2228; --muted: #5d6671; --line: #dfe2e6; --ok: #1f7a4d; --warn: #a15c00; --panel: #ffffff; }
  @media (prefers-color-scheme: dark) { :root { --bg: #16191d; --fg: #e8eaed; --muted: #9aa3ad; --line: #2c3238; --ok: #4cc38a; --warn: #e6a23c; --panel: #1d2126; } }
  * { box-sizing: border-box; }
  html, body { margin: 0; background: var(--bg); color: var(--fg); font: 14px/1.5 -apple-system, "Helvetica Neue", Arial, sans-serif; }
  main { max-width: 920px; padding: 16px; display: flex; flex-direction: column; gap: 22px; }
  h1 { font-size: 26px; font-weight: 600; margin: 0 0 4px; }
  h2 { font-size: 16px; font-weight: 600; margin: 0; }
  p { margin: 0; }
  .muted { color: var(--muted); font-size: 12.5px; }
  .lede b { font-variant-numeric: tabular-nums; }
  .bar { display: flex; height: 10px; border-radius: 5px; overflow: hidden; background: var(--line); margin-top: 10px; }
  .bar i { display: block; height: 100%; }
  .bar .done { background: var(--ok); } .bar .progress { background: var(--warn); }
  .wrap { overflow-x: auto; }
  table { border-collapse: collapse; width: 100%; }
  th, td { text-align: left; padding: 6px 10px 6px 0; border-bottom: 1px solid var(--line); }
  th { color: var(--muted); font-weight: 600; font-size: 12px; }
  .num { text-align: right; font-variant-numeric: tabular-nums; }
  .tools { display: flex; flex-wrap: wrap; gap: 8px; justify-content: space-between; align-items: center; }
  select { font: inherit; color: var(--fg); background: var(--panel); border: 1px solid var(--line); border-radius: 6px; padding: 4px 8px; }
  .group { margin-top: 14px; }
  .ghead { display: flex; flex-wrap: wrap; gap: 2px 12px; align-items: baseline; padding-bottom: 4px; border-bottom: 1px solid var(--line); }
  .ghead span { color: var(--muted); font-size: 12px; }
  .row { display: grid; grid-template-columns: 7.2em 7em minmax(0, 1fr); gap: 4px 10px; padding: 6px 0; align-items: start; }
  .who { font-weight: 600; padding-top: 1px; overflow-wrap: anywhere; }
  .task { min-width: 0; overflow-wrap: anywhere; }
  .sub { display: block; color: var(--muted); font-size: 12px; overflow-wrap: anywhere; }
  .pill { font-size: 12px; text-align: center; border: 1px solid currentColor; border-radius: 999px; padding: 2px 8px; }
  .pill.done { color: var(--ok); } .pill.progress { color: var(--warn); } .pill.open { color: var(--muted); }
  @media (max-width: 560px) { .row { grid-template-columns: 7.2em minmax(0, 1fr); } .who { grid-column: 2; } .task { grid-column: 1 / -1; } }
</style>
<main>
  <header>
    <h1 id="title"></h1>
    <p class="muted" id="note"></p>
  </header>
  <section aria-label="Summary">
    <p class="lede"><b id="n_done">0</b> of <b id="n_total">0</b> tasks are done, <b id="n_progress">0</b> in progress and <b id="n_open">0</b> open.</p>
    <div class="bar" id="bar" role="img" aria-label="Share of tasks done and in progress"></div>
  </section>
  <section aria-label="Progress by role">
    <h2>Progress by role</h2>
    <div class="wrap"><table><thead><tr><th>Role</th><th>Role lead</th><th class="num">Done</th><th class="num">Tasks</th></tr></thead><tbody id="roles"></tbody></table></div>
  </section>
  <section aria-label="Task list">
    <div class="tools">
      <h2>Tasks</h2>
      <select id="filter" aria-label="Show tasks">
        <option value="">All tasks</option><option value="done">Done</option><option value="progress">In progress</option><option value="open">Open</option>
      </select>
    </div>
    <div id="list"></div>
  </section>
</main>
<script>
  const DATA = /*TASKS_JSON*/{"title": "", "note": "", "leads": {}, "tasks": []}/*END*/;
  const LABEL = {done: 'Done', progress: 'In progress', open: 'Open'};
  const tasks = DATA.tasks.slice().sort((a, b) => a.n - b.n);
  const $ = (id) => document.getElementById(id);
  const cell = (tr, text, num) => { const td = document.createElement('td'); if (num) td.className = 'num'; td.textContent = String(text); tr.appendChild(td); };
  const count = (list, s) => list.filter((t) => t.status === s).length;

  $('title').textContent = DATA.title;
  $('note').textContent = DATA.note;
  $('n_done').textContent = count(tasks, 'done');
  $('n_total').textContent = tasks.length;
  $('n_progress').textContent = count(tasks, 'progress');
  $('n_open').textContent = count(tasks, 'open');
  ['done', 'progress'].forEach((k) => {
    const seg = document.createElement('i'); seg.className = k;
    seg.style.width = (tasks.length ? 100 * count(tasks, k) / tasks.length : 0) + '%';
    $('bar').appendChild(seg);
  });

  const roles = [...new Set(tasks.map((t) => t.role))];
  roles.forEach((role) => {
    const ts = tasks.filter((t) => t.role === role), tr = document.createElement('tr');
    cell(tr, role); cell(tr, DATA.leads[role] || ''); cell(tr, count(ts, 'done'), true); cell(tr, ts.length, true);
    $('roles').appendChild(tr);
  });

  function draw() {
    const want = $('filter').value, list = $('list');
    list.replaceChildren();
    roles.forEach((role) => {
      const all = tasks.filter((t) => t.role === role), shown = all.filter((t) => !want || t.status === want);
      if (!shown.length) return;
      const grp = document.createElement('div'); grp.className = 'group';
      const head = document.createElement('div'); head.className = 'ghead';
      const s1 = document.createElement('strong'); s1.textContent = role;
      const s2 = document.createElement('span'); s2.textContent = `Responsibility lead: ${DATA.leads[role] || ''} · ${count(all, 'done')} of ${all.length} done`;
      head.append(s1, s2); grp.appendChild(head);
      shown.forEach((t) => {
        const row = document.createElement('div'); row.className = 'row';
        const pill = document.createElement('span'); pill.className = 'pill ' + t.status; pill.textContent = LABEL[t.status] || t.status;
        const who = document.createElement('span'); who.className = 'who'; who.textContent = t.assignee;
        const body = document.createElement('div'); body.className = 'task';
        const txt = document.createElement('span'); txt.textContent = t.task; body.appendChild(txt);
        const ev = document.createElement('span'); ev.className = 'sub'; ev.textContent = 'Req ' + t.req + (t.evidence ? ' · ' + t.evidence : ''); body.appendChild(ev);
        row.append(pill, who, body); grp.appendChild(row);
      });
      list.appendChild(grp);
    });
  }
  $('filter').addEventListener('change', draw);
  draw();
</script>
