<!-- Task board: a standalone page, open it in a browser. The data below is a copy of tasks.json in this folder; to change a status or an assignee, edit the JSON inside the DATA line near the end of this file. -->
<style>
  :root { --bg: #fbfbf9; --fg: #1d2228; --muted: #5d6671; --line: #dfe2e6; --ok: #1f7a4d; --warn: #a15c00; --panel: #ffffff; }
  @media (prefers-color-scheme: dark) { :root { --bg: #16191d; --fg: #e8eaed; --muted: #9aa3ad; --line: #2c3238; --ok: #4cc38a; --warn: #e6a23c; --panel: #1d2126; } }
  * { box-sizing: border-box; }
  html, body { margin: 0; background: var(--bg); color: var(--fg); font: 14px/1.5 -apple-system, "Helvetica Neue", Arial, sans-serif; }
  main { max-width: 920px; padding: 16px; display: flex; flex-direction: column; gap: 22px; }
  h1 { font-size: 26px; font-weight: 600; margin: 0 0 4px; }
  h2 { font-size: 16px; font-weight: 600; margin: 0; }
  p { margin: 0; }
  .muted { color: var(--muted); font-size: 12.5px; }
  .lede b { font-variant-numeric: tabular-nums; }
  .bar { display: flex; height: 10px; border-radius: 5px; overflow: hidden; background: var(--line); margin-top: 10px; }
  .bar i { display: block; height: 100%; }
  .bar .done { background: var(--ok); } .bar .progress { background: var(--warn); }
  .wrap { overflow-x: auto; }
  table { border-collapse: collapse; width: 100%; }
  th, td { text-align: left; padding: 6px 10px 6px 0; border-bottom: 1px solid var(--line); }
  th { color: var(--muted); font-weight: 600; font-size: 12px; }
  .num { text-align: right; font-variant-numeric: tabular-nums; }
  .tools { display: flex; flex-wrap: wrap; gap: 8px; justify-content: space-between; align-items: center; }
  select { font: inherit; color: var(--fg); background: var(--panel); border: 1px solid var(--line); border-radius: 6px; padding: 4px 8px; }
  .group { margin-top: 14px; }
  .ghead { display: flex; flex-wrap: wrap; gap: 2px 12px; align-items: baseline; padding-bottom: 4px; border-bottom: 1px solid var(--line); }
  .ghead span { color: var(--muted); font-size: 12px; }
  .row { display: grid; grid-template-columns: 7.2em 7em minmax(0, 1fr); gap: 4px 10px; padding: 6px 0; align-items: start; }
  .who { font-weight: 600; padding-top: 1px; overflow-wrap: anywhere; }
  .task { min-width: 0; overflow-wrap: anywhere; }
  .sub { display: block; color: var(--muted); font-size: 12px; overflow-wrap: anywhere; }
  .pill { font-size: 12px; text-align: center; border: 1px solid currentColor; border-radius: 999px; padding: 2px 8px; }
  .pill.done { color: var(--ok); } .pill.progress { color: var(--warn); } .pill.open { color: var(--muted); }
  @media (max-width: 560px) { .row { grid-template-columns: 7.2em minmax(0, 1fr); } .who { grid-column: 2; } .task { grid-column: 1 / -1; } }
</style>
<main>
  <header>
    <h1 id="title"></h1>
    <p class="muted" id="note"></p>
  </header>
  <section aria-label="Summary">
    <p class="lede"><b id="n_done">0</b> of <b id="n_total">0</b> tasks are done, <b id="n_progress">0</b> in progress and <b id="n_open">0</b> open.</p>
    <div class="bar" id="bar" role="img" aria-label="Share of tasks done and in progress"></div>
  </section>
  <section aria-label="Progress by role">
    <h2>Progress by role</h2>
    <div class="wrap"><table><thead><tr><th>Role</th><th>Role lead</th><th class="num">Done</th><th class="num">Tasks</th></tr></thead><tbody id="roles"></tbody></table></div>
  </section>
  <section aria-label="Task list">
    <div class="tools">
      <h2>Tasks</h2>
      <select id="filter" aria-label="Show tasks">
        <option value="">All tasks</option><option value="done">Done</option><option value="progress">In progress</option><option value="open">Open</option>
      </select>
    </div>
    <div id="list"></div>
  </section>
</main>
<script>
  const DATA = {"title": "Capstone task board", "note": "A role is a responsibility and stays the same; the name against each task is the current assignee and can change. Edit assignee in this file to hand a task to someone else.", "leads": {"Domain spec & eval design": "Chetan", "Prompt engineering": "Swaroop", "RAG / retrieval": "Kishal", "Agent orchestration & tools": "Jitendra", "Observability & safety": "Ankush", "Front-end & deployment": "Damandeep"}, "tasks": [{"n": 1, "role": "Domain spec & eval design", "assignee": "Chetan", "req": "I", "task": "Written specification and refusal policy", "status": "done", "evidence": "docs/ specification (md and PDF)"}, {"n": 2, "role": "Domain spec & eval design", "assignee": "Chetan", "req": "I", "task": "80-query gold set frozen before code (20 dev, 60 test)", "status": "done", "evidence": "gold/gold_queries.jsonl"}, {"n": 3, "role": "Domain spec & eval design", "assignee": "Kishal", "req": "I", "task": "Verified rules file: 30 records, 29 verified, quotes re-checked", "status": "done", "evidence": "rules/rules.yaml"}, {"n": 4, "role": "Domain spec & eval design", "assignee": "Chetan", "req": "I", "task": "Labelling guide for statuses and failure labels", "status": "done", "evidence": "docs/labelling_guide.md"}, {"n": 5, "role": "Domain spec & eval design", "assignee": "Swaroop", "req": "I", "task": "Second-person review of the gold labels", "status": "open", "evidence": ""}, {"n": 6, "role": "Prompt engineering", "assignee": "Swaroop", "req": "II", "task": "Strategies A, B and C built and compared on dev", "status": "done", "evidence": "docs/results.md"}, {"n": 7, "role": "Prompt engineering", "assignee": "Swaroop", "req": "II", "task": "How the 8B model breaks, written up with examples", "status": "done", "evidence": "technical report, section 3"}, {"n": 8, "role": "Prompt engineering", "assignee": "Jitendra", "req": "II", "task": "Structured JSON output with schema validation and retry", "status": "done", "evidence": "src/llm.py"}, {"n": 9, "role": "Prompt engineering", "assignee": "Damandeep", "req": "II", "task": "Prompt lab page: A, B, C side by side", "status": "done", "evidence": "Prompt lab page"}, {"n": 10, "role": "Prompt engineering", "assignee": "Swaroop", "req": "II", "task": "Strategy comparison re-run on the course model", "status": "done", "evidence": "eval/results/summary_dev.json"}, {"n": 11, "role": "RAG / retrieval", "assignee": "Kishal", "req": "III", "task": "Corpus of 1,080 RBI documents, 43,336 chunks", "status": "done", "evidence": "data/parsed/corpus_manifest.json"}, {"n": 12, "role": "RAG / retrieval", "assignee": "Kishal", "req": "III", "task": "PDF ingestion with quality checks (987 from PDF)", "status": "done", "evidence": "src/ingest/"}, {"n": 13, "role": "RAG / retrieval", "assignee": "Kishal", "req": "III", "task": "Paragraph-aware chunking, split at 220 words", "status": "done", "evidence": "src/ingest/parse.py"}, {"n": 14, "role": "RAG / retrieval", "assignee": "Kishal", "req": "III", "task": "Hybrid BM25 and dense search with rank fusion", "status": "done", "evidence": "src/index/hybrid.py"}, {"n": 15, "role": "RAG / retrieval", "assignee": "Kishal", "req": "III", "task": "Cross-encoder reranker and lender-type filter", "status": "done", "evidence": "src/index/hybrid.py"}, {"n": 16, "role": "RAG / retrieval", "assignee": "Ankush", "req": "III", "task": "Recall at 5 measured apart from answers (1.0 on dev)", "status": "done", "evidence": "eval/retrieval_eval.py"}, {"n": 17, "role": "RAG / retrieval", "assignee": "Kishal", "req": "III", "task": "Run the other three chunking schemes", "status": "open", "evidence": "eval/chunking_eval.py"}, {"n": 18, "role": "RAG / retrieval", "assignee": "Jitendra", "req": "III", "task": "Recency or superseded-document handling in ranking", "status": "open", "evidence": ""}, {"n": 19, "role": "Agent orchestration & tools", "assignee": "Jitendra", "req": "IV", "task": "LangGraph planner, executor, critic loop with one retry", "status": "done", "evidence": "src/agents/graph.py"}, {"n": 20, "role": "Agent orchestration & tools", "assignee": "Jitendra", "req": "IV", "task": "10 rule tools, search tool and rule_in_force", "status": "done", "evidence": "src/tools/checks.py"}, {"n": 21, "role": "Agent orchestration & tools", "assignee": "Jitendra", "req": "IV", "task": "Code critic that compares every judgement with the tools", "status": "done", "evidence": "src/agents/steps.py"}, {"n": 22, "role": "Agent orchestration & tools", "assignee": "Jitendra", "req": "IV", "task": "Conversation memory per officer and application", "status": "done", "evidence": "src/agents/memory.py"}, {"n": 23, "role": "Agent orchestration & tools", "assignee": "Jitendra", "req": "IV", "task": "Step cap, token budget, time limit, malformed JSON handling", "status": "done", "evidence": "docs/agentic_layer.md"}, {"n": 24, "role": "Agent orchestration & tools", "assignee": "Damandeep", "req": "IV", "task": "Course endpoint limits: queue, rate limit, retry, 512-token clamp", "status": "done", "evidence": "src/llm.py"}, {"n": 25, "role": "Agent orchestration & tools", "assignee": "Chetan", "req": "IV", "task": "Call amendment_chain for amendment questions", "status": "open", "evidence": ""}, {"n": 26, "role": "Observability & safety", "assignee": "Ankush", "req": "V", "task": "One JSON trace per question and a step-level activity log", "status": "done", "evidence": "src/tracing/"}, {"n": 27, "role": "Observability & safety", "assignee": "Ankush", "req": "V", "task": "Failure taxonomy: four labels with trace ids", "status": "done", "evidence": "docs/failure_taxonomy.md"}, {"n": 28, "role": "Observability & safety", "assignee": "Ankush", "req": "VI", "task": "Prompt injection set, 15 cases", "status": "done", "evidence": "eval/sets/injection.jsonl"}, {"n": 29, "role": "Observability & safety", "assignee": "Ankush", "req": "VI", "task": "PII masking set, 15 cases", "status": "done", "evidence": "eval/sets/pii.jsonl"}, {"n": 30, "role": "Observability & safety", "assignee": "Swaroop", "req": "VI", "task": "Refusal set, 10 cases", "status": "done", "evidence": "eval/sets/refusal.jsonl"}, {"n": 31, "role": "Observability & safety", "assignee": "Ankush", "req": "V", "task": "Ragas report on the dev set (faithfulness, relevancy, precision)", "status": "done", "evidence": "eval/ragas_eval.py"}, {"n": 32, "role": "Observability & safety", "assignee": "Ankush", "req": "V", "task": "Full evaluation re-run on the course endpoints", "status": "done", "evidence": "docs/results.md"}, {"n": 33, "role": "Observability & safety", "assignee": "Ankush", "req": "V", "task": "Export traces to LangSmith, Langfuse or OpenTelemetry", "status": "open", "evidence": ""}, {"n": 34, "role": "Observability & safety", "assignee": "Chetan", "req": "V", "task": "Two-person agreement check on failure labels", "status": "open", "evidence": ""}, {"n": 35, "role": "Front-end & deployment", "assignee": "Damandeep", "req": "VI", "task": "Streamlit workspace: queue, checks, comments, sign-off", "status": "done", "evidence": "src/app/main.py"}, {"n": 36, "role": "Front-end & deployment", "assignee": "Damandeep", "req": "VI", "task": "Docker Compose with Qdrant and mounted certificates", "status": "done", "evidence": "docker-compose.yml"}, {"n": 37, "role": "Front-end & deployment", "assignee": "Damandeep", "req": "VI", "task": "Caching and rate limiting (6 questions a minute)", "status": "done", "evidence": "src/app/ratelimit.py"}, {"n": 38, "role": "Front-end & deployment", "assignee": "Damandeep", "req": "VI", "task": "Retrieval lab, History and evaluation, Activity log pages", "status": "done", "evidence": "src/app/main.py"}, {"n": 39, "role": "Front-end & deployment", "assignee": "Damandeep", "req": "VI", "task": "Five minute narrated demo video and demo scripts", "status": "done", "evidence": "docs/demo/"}, {"n": 40, "role": "Front-end & deployment", "assignee": "Chetan", "req": "VI", "task": "12-page technical report with PDF", "status": "done", "evidence": "docs/technical_report.pdf"}, {"n": 41, "role": "Front-end & deployment", "assignee": "Jitendra", "req": "VI", "task": "Single technical documentation file", "status": "done", "evidence": "docs/technical_documentation.md"}, {"n": 42, "role": "Front-end & deployment", "assignee": "Damandeep", "req": "VI", "task": "Rebuild Docker with final results and commit to git", "status": "progress", "evidence": ""}, {"n": 43, "role": "Observability & safety", "assignee": "Ankush", "req": "V", "task": "Ragas judge reads what the drafter read; lookups and checks scored apart", "status": "done", "evidence": "eval/ragas_eval.py"}, {"n": 44, "role": "Observability & safety", "assignee": "Ankush", "req": "V", "task": "Ragas tool call F1, tool call accuracy and agent goal accuracy", "status": "done", "evidence": "eval/results/ragas_dev_C.json"}, {"n": 45, "role": "Agent orchestration & tools", "assignee": "Jitendra", "req": "IV", "task": "Drafter given the text of the cited paragraphs", "status": "done", "evidence": "src/agents/steps.py"}, {"n": 46, "role": "Agent orchestration & tools", "assignee": "Jitendra", "req": "IV", "task": "Model-only hint removed from the officer-facing note", "status": "done", "evidence": "src/tools/checks.py"}, {"n": 47, "role": "Observability & safety", "assignee": "Ankush", "req": "V", "task": "Full evaluation re-run after the drafter change (test C 56 of 60)", "status": "done", "evidence": "eval/results/summary_test.json"}, {"n": 48, "role": "Front-end & deployment", "assignee": "Chetan", "req": "VI", "task": "Intermediate result files removed; documents report the final run", "status": "done", "evidence": "docs/results.md"}, {"n": 49, "role": "Front-end & deployment", "assignee": "Chetan", "req": "VI", "task": "README, report, technical documentation and slides updated", "status": "done", "evidence": "docs/technical_report.pdf"}, {"n": 50, "role": "Front-end & deployment", "assignee": "Damandeep", "req": "VI", "task": "Task board moved out of the app to a standalone page", "status": "done", "evidence": "src/app/board/task_board.html"}, {"n": 51, "role": "Front-end & deployment", "assignee": "Damandeep", "req": "VI", "task": "Update the online slide deck to the final results", "status": "open", "evidence": ""}]};
  const LABEL = {done: 'Done', progress: 'In progress', open: 'Open'};
  const tasks = DATA.tasks.slice().sort((a, b) => a.n - b.n);
  const $ = (id) => document.getElementById(id);
  const cell = (tr, text, num) => { const td = document.createElement('td'); if (num) td.className = 'num'; td.textContent = String(text); tr.appendChild(td); };
  const count = (list, s) => list.filter((t) => t.status === s).length;

  $('title').textContent = DATA.title;
  $('note').textContent = DATA.note;
  $('n_done').textContent = count(tasks, 'done');
  $('n_total').textContent = tasks.length;
  $('n_progress').textContent = count(tasks, 'progress');
  $('n_open').textContent = count(tasks, 'open');
  ['done', 'progress'].forEach((k) => {
    const seg = document.createElement('i'); seg.className = k;
    seg.style.width = (tasks.length ? 100 * count(tasks, k) / tasks.length : 0) + '%';
    $('bar').appendChild(seg);
  });

  const roles = [...new Set(tasks.map((t) => t.role))];
  roles.forEach((role) => {
    const ts = tasks.filter((t) => t.role === role), tr = document.createElement('tr');
    cell(tr, role); cell(tr, DATA.leads[role] || ''); cell(tr, count(ts, 'done'), true); cell(tr, ts.length, true);
    $('roles').appendChild(tr);
  });

  function draw() {
    const want = $('filter').value, list = $('list');
    list.replaceChildren();
    roles.forEach((role) => {
      const all = tasks.filter((t) => t.role === role), shown = all.filter((t) => !want || t.status === want);
      if (!shown.length) return;
      const grp = document.createElement('div'); grp.className = 'group';
      const head = document.createElement('div'); head.className = 'ghead';
      const s1 = document.createElement('strong'); s1.textContent = role;
      const s2 = document.createElement('span'); s2.textContent = `Responsibility lead: ${DATA.leads[role] || ''} · ${count(all, 'done')} of ${all.length} done`;
      head.append(s1, s2); grp.appendChild(head);
      shown.forEach((t) => {
        const row = document.createElement('div'); row.className = 'row';
        const pill = document.createElement('span'); pill.className = 'pill ' + t.status; pill.textContent = LABEL[t.status] || t.status;
        const who = document.createElement('span'); who.className = 'who'; who.textContent = t.assignee;
        const body = document.createElement('div'); body.className = 'task';
        const txt = document.createElement('span'); txt.textContent = t.task; body.appendChild(txt);
        const ev = document.createElement('span'); ev.className = 'sub'; ev.textContent = 'Req ' + t.req + (t.evidence ? ' · ' + t.evidence : ''); body.appendChild(ev);
        row.append(pill, who, body); grp.appendChild(row);
      });
      list.appendChild(grp);
    });
  }
  $('filter').addEventListener('change', draw);
  draw();
</script>
